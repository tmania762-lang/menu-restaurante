<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6b3e22">
<meta name="description" content="Menú digital del Restaurante Casablanca · El Boquerón · Abarán">
<title>Restaurante Casablanca · El Boquerón</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --brown:#5b351f;
  --brown2:#7b4b2a;
  --cream:#f7f0e3;
  --cream2:#fffaf2;
  --gold:#b98a45;
  --text:#35271e;
  --muted:#76685d;
  --white:#fff;
  --border:#e5d7c4;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cream);
  color:var(--text);
  line-height:1.5;
}

header{
  background:
    linear-gradient(rgba(78,43,24,.88),rgba(78,43,24,.88)),
    repeating-linear-gradient(90deg,#6b4024 0,#6b4024 8px,#704529 8px,#704529 16px);
  color:white;
  text-align:center;
  padding:38px 18px 30px;
  border-bottom:4px solid var(--gold);
}

.logo{
  width:82px;
  height:82px;
  margin:0 auto 14px;
  border:2px solid #e5c17a;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  background:rgba(255,255,255,.08);
}

header h1{
  font-family:Georgia,serif;
  font-size:34px;
  letter-spacing:2px;
}

header p{
  margin-top:6px;
  color:#f3dfbb;
  font-size:15px;
}

.lang{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--cream2);
  padding:10px;
  display:flex;
  justify-content:center;
  gap:7px;
  border-bottom:1px solid var(--border);
}

.lang button,
.category button{
  border:1px solid var(--border);
  background:white;
  color:var(--brown);
  border-radius:20px;
  padding:8px 13px;
  font-weight:bold;
  cursor:pointer;
}

.lang button.active,
.category button.active{
  background:var(--brown);
  color:white;
  border-color:var(--brown);
}

.actions{
  max-width:850px;
  margin:18px auto 0;
  padding:0 14px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.action{
  text-decoration:none;
  background:white;
  color:var(--brown);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px 7px;
  text-align:center;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

.action span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.search{
  max-width:850px;
  margin:18px auto 10px;
  padding:0 14px;
}

.search input{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:14px;
  font-size:16px;
  outline:none;
  background:white;
}

.category{
  max-width:900px;
  margin:10px auto 20px;
  padding:0 12px;
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.category::-webkit-scrollbar{display:none}

main{
  max-width:900px;
  margin:auto;
  padding:0 14px 35px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:25px 0 12px;
  color:var(--brown);
  font-family:Georgia,serif;
  font-size:25px;
}

.section-title:after{
  content:"";
  height:1px;
  background:var(--gold);
  flex:1;
}

.card{
  background:var(--cream2);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:11px;
  box-shadow:0 3px 12px rgba(63,40,20,.06);
}

.card h3{
  color:var(--brown);
  font-size:18px;
}

.card p{
  margin-top:4px;
  color:var(--muted);
  font-size:14px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px;
}

.badge{
  background:#efe3d1;
  border:1px solid #dfcdb5;
  color:#60432c;
  border-radius:20px;
  padding:4px 8px;
  font-size:12px;
}

.season{
  background:#e9dfbf;
  border-color:#cdb87b;
}

.allergen-box{
  margin:25px 0;
  padding:17px;
  border-radius:16px;
  background:#fff8ea;
  border:1px solid #e2c994;
}

.allergen-box h3{
  color:var(--brown);
  margin-bottom:8px;
}

.allergen-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
  margin-top:12px;
}

.allergen-item{
  font-size:12px;
  color:#5c5047;
}

footer{
  background:var(--brown);
  color:#f7ead6;
  text-align:center;
  padding:28px 16px;
}

footer strong{
  font-family:Georgia,serif;
  font-size:20px;
}

footer p{
  margin-top:6px;
  font-size:13px;
}

.hidden{display:none!important}

@media(max-width:500px){
  header h1{font-size:29px}
  .actions{grid-template-columns:1fr 1fr 1fr}
  .action{font-size:11px}
  .action span{font-size:20px}
  .allergen-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="lang">
  <button class="active" onclick="setLang('es',this)">🇪🇸 ES</button>

  <button onclick="setLang('fr',this)">🇫🇷 FR</button>
</div>

<div class="actions">
  <a class="action" href="tel:+34968776161">
    <span>📞</span>
    <label data-i18n="reserve">RESERVAS</label>
  </a>

  <a class="action"
     href="https://www.google.com/maps/search/?api=1&query=Restaurante+Casablanca+El+Boquerón+Abarán+Murcia"

<div class="search">

<div class="category" id="categories"></div>

<main id="menu"></main>

let lang="es";
let selectedCat="all";

const TXT={
  es:{
    reserve:"RESERVAS",
    directions:"CÓMO LLEGAR",
    reviews:"RESEÑAS",
    search:"Buscar en el menú...",
    allergens:"Información sobre alérgenos",
    allergenText:"Los símbolos indican los grupos de alérgenos presentes o que pueden estar presentes según la elaboración. Consulte al personal ante cualquier alergia o intolerancia.",
    seasonal:"SOLO EN TEMPORADA"
  },
  en:{
    reserve:"RESERVATIONS",
    directions:"DIRECTIONS",
    reviews:"REVIEWS",
    search:"Search the menu...",
    allergens:"Allergen information",
    allergenText:"The symbols indicate allergen groups present or potentially present depending on preparation. Please ask our staff if you have any allergy or intolerance.",
    seasonal:"SEASONAL"
  },
  fr:{
    reserve:"RÉSERVATIONS",
    directions:"ITINÉRAIRE",
    reviews:"AVIS",
    search:"Rechercher dans le menu...",
    allergens:"Informations sur les allergènes",
    allergenText:"Les symboles indiquent les groupes d'allergènes présents ou susceptibles d'être présents selon la préparation. Veuillez consulter notre personnel en cas d'allergie ou d'intolérance.",
    seasonal:"SAISONNIER"
  }
};

function setLang(newLang,btn){
  lang=newLang;

  document.querySelectorAll(".lang button")
    .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");

  document.documentElement.lang=lang;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    el.textContent=TXT[lang][el.dataset.i18n];
  });

  document.querySelector("#search").placeholder=TXT[lang].search;

  render();
}

function renderCategories(){

  const box=document.querySelector("#categories");

  box.innerHTML=`
    <button class="${selectedCat==="all"?"active":""}"
      onclick="selectCat('all')">
      ${lang==="es"?"Todos":lang==="en"?"All":"Tous"}
    </button>
  `;

  Object.keys(CAT).forEach(cat=>{
    box.innerHTML+=`
      <button class="${selectedCat===cat?"active":""}"
        onclick="selectCat('${cat}')">
        ${CAT[cat][lang]}
      </button>
    `;
  });
}

function selectCat(cat){
  selectedCat=cat;
  render();
}

function render(){

  renderCategories();

  const query=document.querySelector("#search").value
    .toLowerCase()
    .trim();

  const main=document.querySelector("#menu");
  main.innerHTML="";

  Object.keys(CAT).forEach(cat=>{

    if(selectedCat!=="all" && selectedCat!==cat)return;

    const items=MENU.filter(item=>{

      if(item.cat!==cat)return false;

      const text=[
        item.name.es,
        item.name.en,
        item.name.fr,
        item.desc?.es||"",
        item.desc?.en||"",
        item.desc?.fr||""
      ].join(" ").toLowerCase();

      return !query || text.includes(query);
    });

    if(!items.length)return;

    const title=document.createElement("div");
    title.className="section-title";
    title.textContent=CAT[cat][lang];

    main.appendChild(title);

    items.forEach(item=>{

      const card=document.createElement("article");
      card.className="card";

      let badges="";

      if(item.name.es==="Habas y bonito"){
        badges+=`
          <span class="badge season">
            🌱 ${TXT[lang].seasonal}
          </span>`;
      }

      (item.allergens||[]).forEach(a=>{
        const x=ALLERGENS[a];

        badges+=`
          <span class="badge"
                title="${x[lang]}">
            ${x.icon} ${x[lang]}
          </span>`;
      });

      card.innerHTML=`
        <h3>${item.name[lang]}</h3>
        ${item.desc?.[lang]?`<p>${item.desc[lang]}</p>`:""}
        ${badges?`<div class="badges">${badges}</div>`:""}
      `;

      main.appendChild(card);
    });
  });

  const box=document.createElement("section");
  box.className="allergen-box";

  box.innerHTML=`
    <h3>⚠️ ${TXT[lang].allergens}</h3>
    <p>${TXT[lang].allergenText}</p>

    <div class="allergen-grid">
      ${Object.values(ALLERGENS).map(x=>`
        <div class="allergen-item">
          ${x.icon} ${x[lang]}
        </div>
      `).join("")}
    </div>
  `;

  main.appendChild(box);
}

render();

</script>
